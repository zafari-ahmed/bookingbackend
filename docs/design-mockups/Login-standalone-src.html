<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<template id="__bundler_thumbnail" data-bg-color="#F7F5EF">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#F7F5EF"/>
    <rect x="360" y="150" width="480" height="500" rx="36" fill="#FFFFFF" stroke="#E7E2D6" stroke-width="4"/>
    <circle cx="600" cy="250" r="42" fill="#2F7D6B"/>
    <rect x="470" y="330" width="260" height="18" rx="9" fill="#132A45"/>
    <rect x="520" y="368" width="160" height="12" rx="6" fill="#C9CDD2"/>
    <rect x="430" y="424" width="340" height="52" rx="16" fill="#FCFBF7" stroke="#E0DACC" stroke-width="3"/>
    <rect x="430" y="492" width="340" height="52" rx="16" fill="#FCFBF7" stroke="#E0DACC" stroke-width="3"/>
    <rect x="430" y="562" width="340" height="52" rx="16" fill="#132A45"/>
  </svg>
</template>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #F7F5EF; }
  body { font-family: "Public Sans", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #2E5FA8; text-decoration: none; }
  a:hover { color: #132A45; text-decoration: underline; }
  ::placeholder { color: #A8A297; }
</style>
</helmet>

<div style="min-height: 100vh; background: #F7F5EF; color: #23303C; font-family: 'Public Sans', Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 32px 20px; box-sizing: border-box;">

  <div style="width: 100%; max-width: 420px; display: grid; gap: 16px;">

    <div style="background: #FFFFFF; border: 1px solid #E7E2D6; border-radius: 14px; box-shadow: 0 1px 2px rgba(19, 42, 69, 0.04), 0 8px 24px rgba(19, 42, 69, 0.06); padding: 38px 34px 30px;">

      <div style="display: flex; justify-content: center;">
        <div style="width: 52px; height: 52px; border-radius: 999px; background: #2F7D6B; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 17px; font-weight: 800; letter-spacing: 0.04em;">DC</div>
      </div>

      <div style="text-align: center; margin-top: 20px;">
        <div style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #8A9099;">Government of Sindh</div>
        <h1 style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: #132A45; margin: 9px 0 0; line-height: 1.3; text-wrap: pretty;">District Coordination — Case Management System</h1>
        <p style="font-size: 14px; color: #6E7784; margin: 8px 0 0;">Sign in to continue</p>
      </div>

      <div style="display: grid; gap: 16px; margin-top: 28px;">

        <div style="display: grid; gap: 7px;">
          <label style="font-size: 12.5px; font-weight: 700; color: #3D4854;">Email or Username</label>
          <input type="text" placeholder="name@sindh.gov.pk" style="background: #FCFBF7; border: 1px solid #E0DACC; border-radius: 10px; padding: 12px 14px; font-family: inherit; font-size: 14px; color: #23303C; outline: none; width: 100%; box-sizing: border-box;" style-focus="border-color: #2F7D6B; background: #FFFFFF;" />
        </div>

        <div style="display: grid; gap: 7px;">
          <label style="font-size: 12.5px; font-weight: 700; color: #3D4854;">Password</label>
          <div style="display: flex; align-items: center; gap: 4px; background: #FCFBF7; border: 1px solid #E0DACC; border-radius: 10px; padding: 0 6px 0 14px;">
            <input type="{{ pwType }}" placeholder="Enter your password" style="flex: 1; border: none; background: transparent; font-family: inherit; font-size: 14px; color: #23303C; outline: none; padding: 12px 0; min-width: 0;" />
            <button type="button" onClick="{{ togglePw }}" title="{{ pwLabel }}" style="border: none; background: transparent; color: #6E7784; font-size: 12px; font-family: inherit; font-weight: 700; padding: 7px 10px; border-radius: 8px; cursor: pointer; flex: none;" style-hover="background: #F1EDE2; color: #132A45;">{{ pwLabelShort }}</button>
          </div>
          <div style="display: flex; justify-content: flex-end;">
            <a href="#reset" style="font-size: 12.5px; font-weight: 600; color: #2E5FA8;">Forgot password?</a>
          </div>
        </div>

        <button type="button" style="width: 100%; background: #132A45; color: #FFFFFF; border: none; border-radius: 10px; padding: 13px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;" style-hover="background: #1C3A5C;">Sign In</button>
      </div>

      <div style="border-top: 1px solid #F1EDE2; margin-top: 26px; padding-top: 16px;">
        <p style="font-size: 12.5px; color: #949AA2; text-align: center; margin: 0; line-height: 1.5;">For access issues, contact your AC office administrator.</p>
      </div>
    </div>

    <sc-if value="{{ showFooter }}" hint-placeholder-val="{{ true }}">
      <p style="font-size: 11.5px; color: #A5A096; text-align: center; margin: 0; line-height: 1.5;">Official use only · Office of the Assistant Commissioner</p>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:700},&quot;showAgencyFooter&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Page&quot;}}">
class Component extends DCLogic {
  state = { show: false };
  renderVals() {
    const show = this.state.show;
    return {
      pwType: show ? "text" : "password",
      pwLabelShort: show ? "Hide" : "Show",
      pwLabel: show ? "Hide password" : "Show password",
      showFooter: this.props.showAgencyFooter !== false,
      togglePw: () => this.setState(s => ({ show: !s.show }))
    };
  }
}
</script>
</body>
</html>

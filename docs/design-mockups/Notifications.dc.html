<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #F7F5EF; }
  body { font-family: "Public Sans", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #1F5C7A; text-decoration: none; }
  a:hover { color: #132A45; text-decoration: underline; }
  ::placeholder { color: #A8A297; }
  @media (max-width: 900px) { .om-search { display: none !important; } }
</style>
</helmet>

<div style="min-height: 100vh; background: #F7F5EF; color: #23303C; font-family: 'Public Sans', Helvetica, Arial, sans-serif; display: flex; flex-direction: column;">

  <header style="background: #132A45; padding: 14px 24px; display: flex; align-items: center; gap: 20px; position: relative; z-index: 30;">
    <div style="display: flex; align-items: center; gap: 12px; flex: none;">
      <div style="width: 40px; height: 40px; border-radius: 999px; background: #2F7D6B; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 800; letter-spacing: 0.04em; flex: none;">DC</div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #9AA8B8;">Government of Sindh</div>
        <div style="font-size: 16px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.01em;">District Coordination — CMS</div>
      </div>
    </div>

    <div class="om-search" style="flex: 1; display: {{ searchDisplay }}; justify-content: center;">
      <div style="display: flex; align-items: center; gap: 9px; background: #1B3251; border: 1px solid #294564; border-radius: 999px; padding: 9px 16px; width: 100%; max-width: 420px;">
        <span style="color: #7C8EA3; font-size: 13px;">⌕</span>
        <input type="text" placeholder="Search cases, complainants, departments" style="flex: 1; border: none; background: transparent; font-family: inherit; font-size: 13px; color: #FFFFFF; outline: none; min-width: 0;" />
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; flex: none;">
      <div style="position: relative;">
        <button type="button" title="Notifications" style="width: 38px; height: 38px; border-radius: 10px; border: 1px solid #2F7D6B; background: #1B3251; color: #FFFFFF; font-size: 18px; line-height: 1; cursor: pointer;" style-hover="background: #1E3A5C;">◉</button>
        <span style="display: {{ badgeDisplay }}; position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; border-radius: 999px; background: #B23A3A; color: #FFFFFF; font-size: 10.5px; font-weight: 700; align-items: center; justify-content: center; padding: 0 5px; box-sizing: border-box;">{{ unreadCount }}</span>
      </div>
      <div style="width: 34px; height: 34px; border-radius: 999px; background: #2F7D6B; color: #FFFFFF; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none;">SJ</div>
    </div>
  </header>

  <div style="display: flex; flex: 1; min-height: 0; align-items: stretch;">

    <nav style="width: 240px; flex: none; background: #132A45; display: {{ sidebarDisplay }}; flex-direction: column; padding: 16px 10px;">
      <div style="display: grid; gap: 3px;">
        <sc-for list="{{ navItems }}" as="it" hint-placeholder-count="8">
          <button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; border: none; border-radius: 10px; padding: 11px 12px; background: {{ it.bg }}; color: {{ it.fg }}; font-family: inherit; font-size: 13.5px; font-weight: {{ it.weight }}; cursor: pointer; text-align: left; position: relative; overflow: hidden;" style-hover="background: #1B3251; color: #FFFFFF;">
            <span style="position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: {{ it.accent }};"></span>
            <span style="width: 20px; text-align: center; font-size: 14px; flex: none;">{{ it.icon }}</span>
            <span style="white-space: nowrap;">{{ it.label }}</span>
          </button>
        </sc-for>
      </div>
      <div style="margin-top: auto; border-top: 1px solid #22405F; padding-top: 12px; display: flex; align-items: center; gap: 11px;">
        <div style="width: 34px; height: 34px; border-radius: 999px; background: #2F7D6B; color: #FFFFFF; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none;">SJ</div>
        <div style="min-width: 0; flex: 1;">
          <div style="font-size: 13px; font-weight: 700; color: #FFFFFF;">Shazia Junejo</div>
          <div style="font-size: 11px; color: #8FA0B4; margin-top: 2px;">AC Office · Super Admin</div>
        </div>
      </div>
    </nav>

    <main style="flex: 1; min-width: 0; padding: 26px 32px 56px;">

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
        <div>
          <h1 style="font-size: 28px; font-weight: 800; letter-spacing: -0.025em; color: #132A45; margin: 0;">Notifications</h1>
          <p style="font-size: 14px; color: #6E7784; margin: 6px 0 0;">{{ summary }}</p>
        </div>
        <button type="button" onClick="{{ markAll }}" style="border: none; background: transparent; padding: 8px 0; font-family: inherit; font-size: 13px; font-weight: 700; color: #1F5C7A; cursor: pointer;" style-hover="color: #132A45;">Mark all as read</button>
      </div>

      <div style="display: flex; gap: 6px; flex-wrap: wrap; margin: 20px 0 14px;">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
          <button type="button" onClick="{{ t.select }}" style="border: 1px solid {{ t.border }}; background: {{ t.bg }}; color: {{ t.fg }}; border-radius: 999px; padding: 9px 17px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;" style-hover="border-color: #132A45;">{{ t.label }}</button>
        </sc-for>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E7E2D6; border-radius: 14px; overflow: hidden;">
        <sc-for list="{{ rows }}" as="n" hint-placeholder-count="6">
          <div onClick="{{ n.open }}" style="display: flex; align-items: flex-start; gap: 14px; padding: 16px 20px 16px 17px; border-bottom: 1px solid #F1EDE2; border-left: 3px solid {{ n.leftBar }}; background: {{ n.rowBg }}; cursor: pointer;" style-hover="background: #F6F4EC;">
            <div style="width: 32px; height: 32px; border-radius: 10px; background: {{ n.iconBg }}; color: {{ n.iconFg }}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none;">{{ n.icon }}</div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 14px; color: #23303C; line-height: 1.5;">{{ n.prefix }}<span style="font-weight: 700; color: #132A45;">{{ n.caseNo }}</span>{{ n.suffix }}</div>
              <div style="font-size: 12.5px; color: #8A9099; margin-top: 4px;">{{ n.meta }}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; flex: none; padding-top: 2px;">
              <span style="font-size: 12px; color: #949AA2; white-space: nowrap;">{{ n.time }}</span>
              <span style="display: {{ n.dotDisplay }}; width: 8px; height: 8px; border-radius: 999px; background: #2C6395;"></span>
            </div>
          </div>
        </sc-for>

        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 74px 24px;">
            <div style="width: 54px; height: 54px; border-radius: 999px; background: #F1F8F5; color: #2F7D6B; font-size: 20px; display: flex; align-items: center; justify-content: center;">✓</div>
            <div style="font-size: 15px; font-weight: 600; color: #8A9099;">You're all caught up</div>
            <div style="font-size: 13px; color: #A5A096;">{{ emptyHint }}</div>
          </div>
        </sc-if>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showGlobalSearch&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Top bar&quot;},&quot;showSidebar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}">
const TYPE = {
  assigned: { icon: "▤", bg: "#E2ECF7", fg: "#2C6395", group: "Assignments" },
  comment: { icon: "✎", bg: "#EAE7FA", fg: "#4B47A8", group: "Comments" },
  forwarded: { icon: "→", bg: "#E2ECF7", fg: "#2C6395", group: "Assignments" },
  escalated: { icon: "▲", bg: "#FBE3E3", fg: "#B23A3A", group: "Escalations" },
  resolved: { icon: "✓", bg: "#E1EFE0", fg: "#3A6B39", group: "Comments" }
};

const NOTES = [
  { type: "escalated", caseNo: "Case #0008", prefix: "", suffix: " was escalated by Social Welfare.", meta: "15-day resolution window lapsed", time: "2 hours ago", unread: true },
  { type: "assigned", caseNo: "Case #0412", prefix: "", suffix: " was assigned to your desk for department referral.", meta: "Water & Sewerage Board · Ghulam Qadir Bhutto", time: "4 hours ago", unread: true },
  { type: "comment", caseNo: "Case #0404", prefix: "XEN Aftab Kalhoro added a remark on ", suffix: ".", meta: "Site inspection report attached", time: "Yesterday, 12:40 PM", unread: true },
  { type: "forwarded", caseNo: "Case #0400", prefix: "", suffix: " was forwarded to Police Liaison.", meta: "For assistance in disconnection", time: "Yesterday, 02:30 PM", unread: false },
  { type: "resolved", caseNo: "Case #0393", prefix: "", suffix: " was marked resolved by Municipal Corporation.", meta: "Trade licence receipt issued", time: "2 days ago", unread: false },
  { type: "escalated", caseNo: "Case #0397", prefix: "", suffix: " was escalated by Irrigation.", meta: "Transformer replacement pending 21 days", time: "2 days ago", unread: false },
  { type: "comment", caseNo: "Case #0402", prefix: "Taluka Education Officer replied on ", suffix: ".", meta: "Show-cause notice served on the teacher", time: "3 days ago", unread: false },
  { type: "assigned", caseNo: "Case #0391", prefix: "", suffix: " was assigned to Home / Police Liaison.", meta: "Marked urgent by the AC office", time: "4 days ago", unread: false }
];

const NAV = [
  { label: "Dashboard", icon: "▦" },
  { label: "All Cases", icon: "▤" },
  { label: "New Case", icon: "＋" },
  { label: "High Priority", icon: "▲" },
  { label: "Notifications", icon: "◉", active: true },
  { label: "Departments & Access", icon: "◎" },
  { label: "Reports", icon: "◫" },
  { label: "Settings", icon: "⚙" }
];

const TABS = ["All", "Unread", "Assignments", "Comments", "Escalations"];

const EMPTY_HINT = {
  All: "New activity on your cases will appear here.",
  Unread: "Every notification has been read.",
  Assignments: "No new case assignments or referrals.",
  Comments: "No new remarks on your cases.",
  Escalations: "Nothing has been escalated recently."
};

class Component extends DCLogic {
  state = { tab: "All", read: {} };

  isUnread(i) { return NOTES[i].unread && !this.state.read[i]; }

  renderVals() {
    const tab = this.state.tab;
    const indices = NOTES.map((n, i) => i).filter(i => {
      const n = NOTES[i];
      if (tab === "All") return true;
      if (tab === "Unread") return this.isUnread(i);
      return TYPE[n.type].group === tab;
    });
    const unread = NOTES.filter((n, i) => this.isUnread(i)).length;

    return {
      unreadCount: unread,
      searchDisplay: this.props.showGlobalSearch === false ? "none" : "flex",
      sidebarDisplay: this.props.showSidebar === false ? "none" : "flex",
      badgeDisplay: unread ? "flex" : "none",
      summary: unread ? unread + " unread of " + NOTES.length + " notifications" : "All " + NOTES.length + " notifications read",
      navItems: NAV.map(n => ({
        label: n.label, icon: n.icon,
        bg: n.active ? "#1E3A5C" : "transparent",
        fg: n.active ? "#FFFFFF" : "#B8C4D1",
        weight: n.active ? 700 : 500,
        accent: n.active ? "#2F7D6B" : "transparent"
      })),
      tabs: TABS.map(t => ({
        label: t === "Unread" && unread ? "Unread (" + unread + ")" : t,
        bg: t === tab ? "#132A45" : "#FFFFFF",
        fg: t === tab ? "#FFFFFF" : "#3D4854",
        border: t === tab ? "#132A45" : "#E0DACC",
        select: () => this.setState({ tab: t })
      })),
      rows: indices.map(i => {
        const n = NOTES[i];
        const t = TYPE[n.type];
        const unreadRow = this.isUnread(i);
        return {
          icon: t.icon, iconBg: t.bg, iconFg: t.fg,
          prefix: n.prefix, caseNo: n.caseNo, suffix: n.suffix, meta: n.meta, time: n.time,
          rowBg: unreadRow ? "#F7F9FC" : "#FFFFFF",
          leftBar: unreadRow ? "#C2D2E4" : "transparent",
          dotDisplay: unreadRow ? "block" : "none",
          open: () => {
            this.setState(s => ({ read: Object.assign({}, s.read, { [i]: true }) }));
            window.location.href = "Case Detail.dc.html";
          }
        };
      }),
      isEmpty: indices.length === 0,
      emptyHint: EMPTY_HINT[tab],
      markAll: () => {
        const read = {};
        NOTES.forEach((n, i) => { read[i] = true; });
        this.setState({ read });
      }
    };
  }
}
</script>
</body>
</html>
